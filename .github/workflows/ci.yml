name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/tiktoken-cache
      TOKENFLOW_REPORT_DIR: ${{ runner.temp }}/tokenflow-benchmark
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install recorded dependencies and package
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Lint and formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Verify fixture reproducibility
        run: |
          python benchmarks/build_fixtures.py
          git diff --exit-code -- benchmarks/synthetic-v1.jsonl
      - name: Regression tests
        run: pytest -q
      - name: Offline evaluation without model credentials
        run: |
          tokenflow benchmark benchmarks/synthetic-v1.jsonl --output "$TOKENFLOW_REPORT_DIR"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ["TOKENFLOW_REPORT_DIR"]) / "offline.json").read_text())
          assert report["functional_fixture_gate"], "Context preservation regressed"
          assert report["answer_quality_retention"] is None, "Offline results cannot claim quality"
          assert report["cost_reduction"] is None, "Offline results cannot claim billing savings"
          PY
      - name: Save offline measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-benchmark-python-${{ matrix.python }}
          path: ${{ env.TOKENFLOW_REPORT_DIR }}
          if-no-files-found: ignore
          retention-days: 14

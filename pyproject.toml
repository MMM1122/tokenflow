[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenflow-local"
version = "0.1.0"
description = "Measured, conservative context optimization for LLM developers"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "tiktoken>=0.9,<1"]

[project.optional-dependencies]
gateway = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "openai>=1.68,<4"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
tokenflow = "tokenflow.cli:main"

[tool.setuptools.packages.find]
include = ["tokenflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
